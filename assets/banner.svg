<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Dhruv Talegaonkar - Cloud security and AI security" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Dhruv Talegaonkar - Cloud security and AI security</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#04090c"/><stop offset=".55" stop-color="#071a20"/><stop offset="1" stop-color="#0a2a33"/>
  </linearGradient>
  <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#41d9c3"/><stop offset=".5" stop-color="#7aa9ff"/><stop offset="1" stop-color="#41d9c3"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="520 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#41d9c3" stop-opacity=".9"/><stop offset="1" stop-color="#7aa9ff" stop-opacity=".35"/>
  </linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e9b970"/><stop offset="1" stop-color="#41d9c3"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#41d9c3" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#41d9c3" stop-opacity="0"/><stop offset=".5" stop-color="#41d9c3" stop-opacity=".18"/><stop offset="1" stop-color="#41d9c3" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="frame"><rect width="1000" height="320" rx="18"/></clipPath>
  <clipPath id="c0"><rect x="60" y="190" height="40" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.0;0.07;0.21;0.24;1" values="0;0;369.6;369.6;0;0"/></rect></clipPath><clipPath id="c1"><rect x="60" y="190" height="40" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.25;0.32;0.46;0.49;1" values="0;0;343.2;343.2;0;0"/></rect></clipPath><clipPath id="c2"><rect x="60" y="190" height="40" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.5;0.57;0.71;0.74;1" values="0;0;422.4;422.4;0;0"/></rect></clipPath><clipPath id="c3"><rect x="60" y="190" height="40" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.75;0.82;0.96;0.99;1" values="0;0;396.0;396.0;0;0"/></rect></clipPath>
  <style>
    .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:22px}
    .tag{font-family:SFMono-Regular,Consolas,Menlo,monospace;font-size:13px;fill:#e9b970;letter-spacing:2px}
    .name{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:48px;fill:url(#ink);letter-spacing:1px}
    .chip{font-family:SFMono-Regular,Consolas,Menlo,monospace;font-size:12px;fill:#8fb3ad}
  </style>
</defs>
<g clip-path="url(#frame)">
  <rect width="1000" height="320" fill="url(#bg)"/>
  <rect width="1000" height="320" fill="url(#grid)"/>
  <!-- scan line -->
  <rect x="0" y="-80" width="1000" height="80" fill="url(#scan)">
    <animate attributeName="y" from="-80" to="320" dur="5s" repeatCount="indefinite"/>
  </rect>
  <!-- glow orbs -->
  <circle cx="900" cy="60" r="140" fill="#41d9c3" opacity=".06"><animate attributeName="r" values="140;170;140" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="120" cy="300" r="150" fill="#7aa9ff" opacity=".05"><animate attributeName="r" values="150;120;150" dur="9s" repeatCount="indefinite"/></circle>
  <!-- shield cluster -->
  <g transform="translate(850 160)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -8;0 8;0 -8" dur="5s" repeatCount="indefinite"/>
      <circle r="112" fill="none" stroke="#41d9c3" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      </circle>
      <circle r="88" fill="none" stroke="#e9b970" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="18 14">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
      </circle>
      <g transform="translate(-48 -52) scale(1)">
        <path d="M48 5 L83 17 V48 C83 68 68 82 48 91 C28 82 13 68 13 48 V17 Z" transform="translate(-0 0) scale(1)" fill="url(#shield)" fill-opacity=".22" stroke="url(#brass)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M33 49 L44 60 L65 36" fill="none" stroke="#e6f4f1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60">
          <animate attributeName="stroke-dashoffset" values="60;0;0;60" keyTimes="0;.3;.85;1" dur="5s" repeatCount="indefinite"/>
        </path>
      </g>
      <circle r="5" fill="#41d9c3"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/><animate attributeName="cx" values="112" dur="1s" repeatCount="indefinite"/></circle>
      <circle r="4" fill="#e9b970"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/><animate attributeName="cx" values="88" dur="1s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <!-- text -->
  <text x="60" y="78" class="tag">&gt; WHOAMI</text>
  <text x="58" y="146" class="name">DHRUV TALEGAONKAR</text>
  <rect x="60" y="162" width="0" height="3" fill="url(#brass)"><animate attributeName="width" from="0" to="260" dur="1.4s" fill="freeze"/></rect>
  <g clip-path="url(#c0)"><text x="60" y="217" class="mono" fill="#e6f4f1">Cloud security &amp; AI security</text></g><rect y="195" width="3" height="28" fill="#41d9c3"><animate attributeName="x" dur="16s" repeatCount="indefinite" keyTimes="0;0.0;0.07;0.21;0.24;1" values="60;60;429.6;429.6;60;60"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.24" values="1;0"/></rect><g clip-path="url(#c1)"><text x="60" y="217" class="mono" fill="#e6f4f1">ISO/IEC 27001 Lead Auditor</text></g><rect y="195" width="3" height="28" fill="#41d9c3"><animate attributeName="x" dur="16s" repeatCount="indefinite" keyTimes="0;0.25;0.32;0.46;0.49;1" values="60;60;403.2;403.2;60;60"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.49" values="0;1;0"/></rect><g clip-path="url(#c2)"><text x="60" y="217" class="mono" fill="#e6f4f1">U.S. Department of State scholar</text></g><rect y="195" width="3" height="28" fill="#41d9c3"><animate attributeName="x" dur="16s" repeatCount="indefinite" keyTimes="0;0.5;0.57;0.71;0.74;1" values="60;60;482.4;482.4;60;60"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;0.74" values="0;1;0"/></rect><g clip-path="url(#c3)"><text x="60" y="217" class="mono" fill="#e6f4f1">SOC | VAPT | AD security | GRC</text></g><rect y="195" width="3" height="28" fill="#41d9c3"><animate attributeName="x" dur="16s" repeatCount="indefinite" keyTimes="0;0.75;0.82;0.96;0.99;1" values="60;60;456.0;456.0;60;60"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.75;0.99" values="0;1;0"/></rect>
  <text x="60" y="276" class="chip">PUNE, INDIA  //  B.E. IT 2027  //  EX-EY CYBERSECURITY INTERN</text>
  <text x="60" y="296" class="chip" opacity=".7">SOC  /  VAPT  /  CLOUD SECURITY  /  AI SECURITY  /  GRC</text>
</g>
<rect x=".75" y=".75" width="998.5" height="318.5" rx="17.5" fill="none" stroke="#41d9c3" stroke-opacity=".35"/>
</svg>